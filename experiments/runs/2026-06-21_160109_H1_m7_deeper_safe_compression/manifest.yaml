id: H1_m7_deeper_safe_compression
base: m7
goal: "Raise avg compression from ~3x toward 4.5x-5x on shared-pass SAFE tasks, without breaking passes."
subsets: [shared_pass, barely_compressed]
guard: [fragile]
forbid: [persistent_failure_routing, flip_mode_rescue, release_flip_on_pass]
hypothesis: "m7 systematically under-compresses; top miners pass the same tasks at 4.5-5x. Lower the target/caps on tasks m7 already passes with margin."
success_metric: "avg_compression_ratio up >= +0.30x with NO increase in broke_baseline and no new negative_score tasks."
candidate: null
notes: "Push the barely-compressed (<2x) tasks first; they have the most proven headroom (see reports/m7_gap_analysis.md)."
