# Experiment registry for offline next-round research. Each candidate is based on
# m7/v11.1 (NOT flip-routing). Manifests live in experiments/manifests/*.yaml.
# The decision gate (see reports/experiment_backlog.md) is applied by
# summarize_experiments.py against the m7 baseline.
competition_id: 107
baseline: m7            # everything is measured as a delta vs m7/v11.1

# Task subsets the experiment runner can target (resolved by run_experiment_matrix.py
# from data/processed/*). These are evidence-derived sets, regenerated by `make gaps`.
task_subsets:
  shared_pass:        data/processed/shared_pass_tasks.jsonl      # m7 & top both pass — ratio headroom lives here
  barely_compressed:  data/processed/compression_gap_tasks.jsonl  # m7 ratio < 2x
  fragile:            data/processed/fragile_tasks.jsonl          # compression broke a passing baseline
  medium:             null   # NEEDS task->category map (missing); see IMPORT_TEMPLATE
  hard_catastrophic:  null   # NEEDS task->category map (missing); see IMPORT_TEMPLATE
  screener:           null   # screener tasks not exposed per-task with scores

# Decision gate thresholds (vs m7). summarize_experiments.py flags REJECT/PASS.
gate:
  max_broken_baseline_increase: 0      # reject if broken baselines rise at all vs m7
  min_avg_ratio_improvement: 0.30      # reject if avg ratio doesn't rise >= +0.30x
  medium_score_floor_delta: 0.0        # reject if Medium score drops vs m7
  max_new_negative_score_tasks: 0      # prefer no new negative-score tasks
  hard_rescue_guard: true              # Hard gains must not reduce Medium or shared-pass scores

candidates:
  H1M_m7_deeper_safe_v1:
    base: m7
    path: experiments/candidates/H1M_m7_deeper_safe_v1/h1m_miner.py
    profiles: [light, medium, deep]   # env H1M_PROFILE; deep = best offline (+13.7% ratio, 0 regress)
    status: offline-validated          # ratio+safety measured; platform pass/neg-run PENDING_EVAL
    note: "m7 + deeper HARVEST-only compression; rich/guards/coach untouched; fragile guard at 3 hits."
