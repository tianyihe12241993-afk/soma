# Dashboard collection config.
# The SOMA dashboard is a Next.js page with the leaderboard embedded as JSON in the HTML.
# collect_dashboard.py fetches the HTML and extracts the per-miner records.
leaderboard_url: "https://thesoma.ai/dashboard"
miner_page_url: "https://thesoma.ai/dashboard/miner/{comp}/{hotkey}"   # per-miner detail (collect_miner_detail.py)
competition_id: 108   # CoT-Compression-4 (was 107; bumped 2026-06-26 — detail scraper was 404ing on comp-108-only miners)

# Display column order on the rendered board is: total, Easy, Hard, Medium.
# But the embedded JSON category_scores key order is {Easy, Medium, Hard} — the
# collector reads the JSON keys by name, so order is not relied upon.
fetch:
  timeout_seconds: 30
  user_agent: "soma-ops-collector/1.0"

# review_status values seen: "scored", "failed review", "pending"/unevaluated.
# Failed-review miners are EXCLUDED from reward-element computation.
review_status_field: "review_status"
